<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdiwalihub Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #333; /* For outside the main container */
        }

        .main-container {
            width: 100%;
            max-width: 1440px; /* Adjust as needed */
            min-height: 100vh;
            background: linear-gradient(135deg, #2e1a14 0%, #a66a3d 100%);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

      

        .user-icon {
            width: 24px;
            height: 24px;
            background-color: transparent; /* Assuming this is an icon placeholder, can replace with actual icon */
            border-radius: 50%;
            border: 1px solid #ccc; /* Match the provided image if it is just a red dot */
            position: relative;
        }

        .user-icon::after { /* To replicate the red dot, if intended as a status */
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 6px;
            height: 6px;
            background-color: red;
            border-radius: 50%;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            color: #fff;
        }
        
        /* The specific triangle logo element */
        .logo-symbol {
            width: 30px;
            height: 30px;
            border: 4px solid #fff; /* Solid triangle look */
            border-radius: 4px; /* Slight rounding for a less harsh look */
            transform: rotate(-15deg); /* Slight rotation */
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2e1a14; /* Dark fill for the background-color in the original */
        }

        /* The smaller internal detail if needed, but the simple one looks cleaner */
        /* .logo-symbol::after {
            content: '';
            width: 8px; height: 8px; background-color: white; border-radius: 50%;
        } */

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #ddd;
            font-size: 1rem;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 1;
        }

        nav a.active {
            color: #ff9f43; /* Match theme color and image highlighting */
            opacity: 1;
        }

        /* Hero Content */
        .hero-section {
            display: flex;
            padding: 40px 40px;
            justify-content: space-between;
            align-items: center;
            flex-grow: 1;
        }

        .hero-text {
            max-width: 50%;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin: 0 0 10px;
            font-weight: bold;
        }

        .name {
            font-size: 3rem;
            margin: 0 0 15px;
            color: #fff;
        }

        .name span {
            color: #ff9f43; /* Accent color for the name */
        }

        .title {
            font-size: 2.2rem;
            color: #cd84f1; /* Purple title */
            margin: 0 0 30px;
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 40px;
            direction: rtl; /* For Somali script alignment if needed, but text looks LTR in image */
            text-align: right;
        }

        .get-in-touch {
            display: inline-block;
            padding: 15px 40px;
            background-color: #ff9f43;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .get-in-touch:hover {
            transform: scale(1.05);
        }

        .profile-container {
            width: 320px;
            position: relative;
        }

        .profile-image-wrapper {
            width: 100%;
            height: 450px;
            border-radius: 30px;
            overflow: hidden;
            border: 2px solid #ff9f43; /* Key feature matching image */
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
        }

        .profile-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Gradient overlay to replicate image tone shift */
        .profile-image-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(138,43,226, 0.4) 0%, rgba(255,165,0, 0) 60%); /* Match image's cool to warm gradient */
            pointer-events: none;
        }

        .extra-dots {
            font-size: 2rem;
            color: rgba(255,255,255,0.2);
            position: absolute;
            top: -30px;
            right: 0px;
            font-weight: bold;
        }

        footer {
            display: flex;
            justify-content: center;
            
        }

        .social-icons-wrapper {
            background-color: #f8f9fa; /* Off-white circular container from image */
            border-radius: 50px;
            padding: 10px 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .social-icons {
            display: flex;
            gap: 15px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .social-icons li a {
            font-size: 1.5rem;
            color: #333;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-icons li a:hover {
            color: #ff9f43;
        }
        
        /* Specific font icons - requires FontAwesome or similar */
        /* To use this, you must add FontAwesome link in <head> */

        /* Media Queries for responsiveness */
        @media (max-width: 1024px) {
            .hero-section {
                flex-direction: column-reverse;
                text-align: center;
                gap: 50px;
            }
            .hero-text {
                max-width: 100%;
            }
            .hero-text h1, .name, .title {
                margin-left: auto;
                margin-right: auto;
            }
            .description {
                text-align: center;
            }
            .profile-container {
                margin: 0 auto;
            }
        }
        
        @media (max-width: 768px) {
            .hero-text h1 { font-size: 2.8rem; }
            .name { font-size: 2.4rem; }
            .title { font-size: 1.8rem; }
            header { padding: 15px 30px; }
        }

    </style>
    <!-- FontAwesome required for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="main-container">
    <!-- <div class="top-bar">
        <span>Isolation_Mode</span>
        <div class="user-icon"></div>
    </div> -->

    <header>
        <div class="logo">
            <div class="logo-symbol">
                A
            </div>
            abdiwalihub
        </div>
        <nav>
            <ul>
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-section">
        <div class="hero-text">
            <h1>Hellow!</h1>
            <p class="name">I'm <span>Abdiwalihub</span></p>
            <p class="title">I am UX/UI Designer</p>
            <p class="description">Waxaan abuuuraa khibrado dhijitaal ah oo soo jiidasho leh, anigoo isku daraya naqshadeynta hal-abuurka leh iyo farsamada programming-ka.</p>
            <a href="#contact" class="get-in-touch">Get in Touch</a>
        </div>
        <div class="profile-container">
            <!-- <span class="extra-dots">Iso...</span> -->
            <div class="profile-image-wrapper">
                <!-- Replace with the path to your actual image file. Assuming the file 'abdiwali_portrait.jpg' exists. -->
                <img src="abdiweli.jpeg" alt="Portrait of Abdiwalihub in a plaid shirt with white beard hair, matching the visual of image_0.png">
                <!-- If you don't have the image file, use a placeholder or base64 data URL for testing -->
                <!-- <img src="data:image/jpeg;base64,...(base64 data from a crop of the original image)..." alt="Placeholder portrait"> -->
            </div>
        </div>
    </div>

    <footer>
        <div class="social-icons-wrapper">
            <ul class="social-icons">
                <!-- Replicating order from image: TikTok, Facebook, Instagram -->
                <li><a href="#"><i class="fab fa-tiktok"></i></a></li>
                <li><a href="#"><i class="fab fa-facebook-f"></i></a></li>
                <li><a href="#"><i class="fab fa-instagram"></i></a></li>
            </ul>
        </div>
    </footer>
</div>

</body>
</html>
