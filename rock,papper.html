<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors ✊✋✌️</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>


<div class="game-area">
<h1>Rock Paper Scissors</h1>
    <div class="player-option">
        <div class="choice-card" id="RockOption" title="Rock">
            ✊
        </div>

        <div class="choice-card" id="PapperOption" title="Paper">
            ✋
        </div>

        <div class="choice-card" id="ScissorsOption" title="Scissors">
            ✌️
        </div>
    </div>

    <div class="computer-card" id="computerDisplay">
        ✊
    </div>

    <button class="reset-button" id="resetBtn">
        <span class="reset-icon">↺</span> Reset
    </button>

</div>

<div class="score-board">
    <div class="score-item">
        Win:- <span id="WinScore">0</span>
    </div>
    <div class="score-item">
        Lose:- <span id="LoseScore">0</span>
    </div>
    <div class="score-item">
        Draw:- <span id="DrawScore">0</span>
    </div>
</div>

<script src="idex.js"></script>

</body>
</html>
